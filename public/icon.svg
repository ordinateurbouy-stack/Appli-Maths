<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid lines resembling graph paper -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.5" />

  <!-- Circle around symbol -->
  <circle cx="256" cy="256" r="160" stroke="#1e293b" stroke-width="12" fill="none" opacity="0.6"/>

  <!-- Stylized Sigma / Math Function Symbol -->
  <!-- Mathematical Pi and Sigma and Integral combination -->
  <path d="M 160 160 H 352 L 272 256 L 352 352 H 160" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing integral symbol in foreground -->
  <path d="M 230 140 C 210 140 200 155 200 175 V 335 C 200 355 210 370 230 370" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" opacity="0.9" />

  <!-- Badge for Lycée -->
  <rect x="176" y="390" width="160" height="40" rx="20" fill="#0284c7" />
  <text x="256" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">LYCÉE MATHS</text>
</svg>
